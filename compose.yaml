# SOC Lab — IOC Enricher API + PostgreSQL
# Usage: docker compose up -d --build
name: soc-lab

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ioc-enricher:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"   # only reachable from this computer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend   # published port and internet access (AbuseIPDB)
      - backend    # talks to the database
    # --- Runtime hardening ---
    read_only: true                      # root filesystem cannot be modified
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m   # small scratch space; nothing in it can run
    cap_drop:
      - ALL                              # no Linux capabilities at all
    security_opt:
      - no-new-privileges:true           # no privilege escalation (setuid binaries)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100                      # stops fork bombs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend    # no published ports: not reachable from the host
    # --- Runtime hardening ---
    read_only: true                      # only the data volume and tmpfs are writable
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/run/postgresql:rw,noexec,nosuid,size=1m   # PostgreSQL socket and lock files
    cap_drop:
      - ALL
    cap_add:                             # the minimum the official image needs to start
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

networks:
  frontend: {}
  backend:
    internal: true   # no internet access for anything on this network

volumes:
  pgdata: {}
