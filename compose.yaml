# SOC Lab — IOC Enricher API + PostgreSQL
# Usage: docker compose up -d --build
name: soc-lab

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ioc-enricher:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"   # only reachable from this computer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend   # published port and internet access (AbuseIPDB)
      - backend    # talks to the database

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend    # no published ports: not reachable from the host

networks:
  frontend: {}
  backend:
    internal: true   # no internet access for anything on this network

volumes:
  pgdata: {}
