name: Release

# Runs when a GitHub release is published (including pre-releases)
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write           # attach the SBOM to the GitHub release
      packages: write           # push the image to GitHub Container Registry
      id-token: write           # short-lived identity used to sign the attestations
      attestations: write       # store the attestations
      artifact-metadata: write  # record where the image is stored
    env:
      TRIVY_VERSION: "0.76.1"
      # From the official trivy_0.76.1_checksums.txt release file
      TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      IMAGE: ghcr.io/patoeq/ioc-enricher
      # Event data goes through env, never straight into a script (prevents injection)
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build the image
        run: >-
          docker build --pull -f docker/Dockerfile
          --label "org.opencontainers.image.version=$VERSION"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$IMAGE:$VERSION" .

      - name: Enforce the acceptance rule before publishing
        run: >-
          trivy image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 "$IMAGE:$VERSION"

      - name: Log in to GitHub Container Registry
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE:$VERSION"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attach the SBOM to the release
        run: gh release upload "$VERSION" sbom.cdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
